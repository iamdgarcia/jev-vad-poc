[project]
name = "jev-vad"
version = "0.1.0"
description = "Semantic VAD (barge-in / turn-end / backchannel) over Spanish partial ASR transcripts, powered by the Laya System-1 decision model (int4 ONNX, mmBERT encoder)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "IABTO" }]
dependencies = [
    "laya>=0.3.23,<0.4",
    "onnxruntime>=1.24,<2",
    "huggingface-hub>=1.0",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jev_vad"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
